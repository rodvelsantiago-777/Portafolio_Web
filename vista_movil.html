<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vista movil | Portafolio SRV</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080605;
      --panel: rgba(15, 13, 12, 0.88);
      --line: rgba(255, 255, 255, 0.14);
      --text: #f4efe8;
      --muted: rgba(244, 239, 232, 0.62);
      --accent: #b8955d;
      --red: #9d1717;
      --phone-width: 390px;
      --phone-height: 844px;
      --scale: 1;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow-x: hidden;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 12%, rgba(157, 23, 23, 0.22), transparent 34rem),
        radial-gradient(circle at 82% 20%, rgba(42, 93, 83, 0.18), transparent 30rem),
        linear-gradient(135deg, #100706 0%, #080706 42%, #0c1110 100%);
    }

    .preview-shell {
      min-height: 100vh;
      display: grid;
      grid-template-columns: minmax(240px, 320px) minmax(0, 1fr);
      gap: 28px;
      padding: 24px;
      align-items: start;
    }

    .toolbar {
      position: sticky;
      top: 24px;
      padding: 22px;
      border: 1px solid var(--line);
      background: linear-gradient(180deg, rgba(17, 13, 11, 0.96), rgba(9, 9, 8, 0.9));
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.38);
    }

    .brand {
      margin: 0 0 20px;
      font-size: 14px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--accent);
    }

    .toolbar h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1;
      text-transform: uppercase;
      letter-spacing: 0.02em;
    }

    .toolbar p {
      margin: 14px 0 24px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .control-group {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .control-label {
      font-size: 11px;
      color: var(--muted);
      letter-spacing: 0.11em;
      text-transform: uppercase;
    }

    button {
      width: 100%;
      border: 1px solid var(--line);
      background: rgba(255, 255, 255, 0.055);
      color: var(--text);
      padding: 11px 12px;
      cursor: pointer;
      text-align: left;
      font-weight: 700;
      letter-spacing: 0.02em;
    }

    button:hover,
    button.active {
      border-color: rgba(184, 149, 93, 0.65);
      background: rgba(184, 149, 93, 0.14);
    }

    .button-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .stage {
      min-height: calc(100vh - 48px);
      display: grid;
      place-items: start center;
      overflow: auto;
      padding: 10px 10px 36px;
    }

    .phone {
      width: calc(var(--phone-width) * var(--scale));
      height: calc(var(--phone-height) * var(--scale));
      display: grid;
      place-items: start center;
    }

    .phone-frame {
      width: var(--phone-width);
      height: var(--phone-height);
      transform: scale(var(--scale));
      transform-origin: top center;
      border: 10px solid #0a0908;
      border-radius: 34px;
      background: #050505;
      box-shadow:
        0 40px 130px rgba(0, 0, 0, 0.58),
        0 0 0 1px rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .phone-frame::before {
      content: "";
      position: absolute;
      z-index: 2;
      top: 8px;
      left: 50%;
      width: 94px;
      height: 20px;
      transform: translateX(-50%);
      border-radius: 0 0 16px 16px;
      background: #090807;
      pointer-events: none;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #050505;
    }

    .hint {
      margin-top: 18px;
      padding-top: 18px;
      border-top: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
    }

    @media (max-width: 820px) {
      .preview-shell {
        grid-template-columns: 1fr;
      }

      .toolbar {
        position: relative;
        top: auto;
      }
    }

    @media (max-width: 500px) {
      .preview-shell {
        padding: 12px;
      }
    }
  </style>
</head>
<body>
  <main class="preview-shell">
    <aside class="toolbar" aria-label="Controles de vista movil">
      <p class="brand">SRV Preview</p>
      <h1>Vista movil</h1>
      <p>Usa esta ventana para probar el portafolio como si estuviera dentro de un celular. Los botones cambian el tamano del dispositivo simulado.</p>

      <div class="control-group">
        <span class="control-label">Dispositivo</span>
        <button class="active" type="button" data-size="390x844">iPhone 13 / 14 - 390 x 844</button>
        <button type="button" data-size="375x667">iPhone SE - 375 x 667</button>
        <button type="button" data-size="412x915">Android grande - 412 x 915</button>
      </div>

      <div class="control-group">
        <span class="control-label">Acciones</span>
        <div class="button-row">
          <button type="button" id="rotateBtn">Rotar</button>
          <button type="button" id="reloadBtn">Recargar</button>
        </div>
      </div>

      <p class="hint">Si haces cambios en el portafolio, pulsa Recargar o usa Ctrl + F5 dentro de esta ventana.</p>
    </aside>

    <section class="stage" aria-label="Portafolio en vista movil">
      <div class="phone" id="phone">
        <div class="phone-frame" id="phoneFrame">
          <iframe id="portfolioFrame" src="/index.html" title="Portafolio de Santiago en vista movil"></iframe>
        </div>
      </div>
    </section>
  </main>

  <script>
    const root = document.documentElement;
    const phoneFrame = document.getElementById("phoneFrame");
    const frame = document.getElementById("portfolioFrame");
    const sizeButtons = Array.from(document.querySelectorAll("[data-size]"));
    let currentWidth = 390;
    let currentHeight = 844;

    function updateScale() {
      const availableWidth = Math.max(260, window.innerWidth - (window.innerWidth > 820 ? 420 : 48));
      const availableHeight = Math.max(420, window.innerHeight - 72);
      const scale = Math.min(1, availableWidth / currentWidth, availableHeight / currentHeight);
      root.style.setProperty("--scale", String(Math.max(0.48, scale)));
    }

    function setDevice(width, height) {
      currentWidth = width;
      currentHeight = height;
      root.style.setProperty("--phone-width", `${width}px`);
      root.style.setProperty("--phone-height", `${height}px`);
      updateScale();
    }

    sizeButtons.forEach((button) => {
      button.addEventListener("click", () => {
        sizeButtons.forEach((item) => item.classList.remove("active"));
        button.classList.add("active");
        const [width, height] = button.dataset.size.split("x").map(Number);
        setDevice(width, height);
      });
    });

    document.getElementById("rotateBtn").addEventListener("click", () => {
      setDevice(currentHeight, currentWidth);
    });

    document.getElementById("reloadBtn").addEventListener("click", () => {
      frame.contentWindow.location.reload();
    });

    window.addEventListener("resize", updateScale);
    updateScale();
  </script>
</body>
</html>
